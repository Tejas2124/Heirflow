# ==========================================
# Google Cloud Build Pipeline for HeirFlow
# Builds Docker image and deploys to Google Cloud Run
# ==========================================
steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/heirflow:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/heirflow:$COMMIT_SHA'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/heirflow:latest'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'heirflow'
      - '--image'
      - 'gcr.io/$PROJECT_ID/heirflow:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=hierflow-db,GCS_BUCKET_NAME=heirflow-evidence-vault'

substitutions:
  _REGION: asia-south1

images:
  - 'gcr.io/$PROJECT_ID/heirflow:latest'
  - 'gcr.io/$PROJECT_ID/heirflow:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

